<!DOCTYPE html>
<html lang="en">
<head>
    <title>test</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.css' />
    <link rel='stylesheet' href='/js/maplibre-gl-compass/dist/maplibre-gl-compass.css' />

    <style>
        body { margin: 0; padding: 0; 
            display: flex; 
            flex-direction: column;
        }
        html, body { height: 100%; }
        #map { 
            flex: 2;
            height: 90%;
            min-height: 10%;
            max-height: 100%;
            resize: vertical;
            overflow: hidden;
            width: 100%;
            border-bottom: 1px solid #ccc;
        }
        .mapResize {
            flex: none !important;
        }
        #info {
            flex: 1;
            width: 100%;
            background-color: #fff;
            overflow: scroll;
            overflow-x: hidden;
        }
        #infoBox { 
        	padding: 0 20px; 
        }
        #infoBox h1, #infoBox h2 {
        	margin: 0; margin-block-start:0; margin-block-end:0; margin-inline-start:0; margin-inline-end:0;
        	text-align: center;
        }
        #infoBox p { 
            clear: both; 
            font-size: 1.5em; /* for improved readability */
        }
        #debug {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translate(-50%);
            width: 50%;
            padding: 10px;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            text-align: center;
            color: #222;
            background: #fff;
        }
        .debug-show {
            display: block;
        }
        .maplibregl-marker {
            display: grid; place-items: center;
        }
        .marker {
            background-color: rgb(255 255 255 / 0.8);
            border: 1px solid #ccc;
            height: 30px;
            width: 30px;
            border-radius: 50%; 
            text-align: center;
            line-height: 30px;
            font-size: 20px;
        }
        .marker_label {
            margin: 0;
            display: none;
            font-size: 12px;
            line-height: 14px;
        }
        .marker_highlight {
            border: 4px solid #aaf;
        }
        .label-show {
          display: inline-block;
        }
        .maplibregl-user-location-dot {
          background: none;
          height: 20px; /* match svg */
          width: 20px;
        }
        .maplibregl-user-location-dot::before, .maplibregl-user-location-dot::after {
            content: none; /* remove default dot content */
        }

        .resize-handle {
            position: relative;
            width: 100px;
            margin: -6px auto 0 auto;
            padding: 1px;
            cursor: row-resize;
            background-color: #f1f3f5;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .resize-handle hr {
            border: none;
            margin: 1px auto;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            height: 1px;
            width: 90%;
        }

        #infoNav {
            display: block;
            padding: 16px;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .infoNavButton {
          display: block;
          align-items: center;
          margin: 10px;
          padding: 10px 20px;
          font-size: 16px;
          font-weight: 500;
          color: #333333;
          background-color: #f1f3f5;
          border: 1px solid #dee2e6;
          border-radius: 6px;
          cursor: pointer;
        }
        button:disabled { color: #ccc; }
        #infoBack { float: left; }
        #infoNext { float: right; }
        /* Visual spacing for the arrows */
        .arrow {
          font-size: 18px;
          line-height: 1;
        }

        /* Hover effect */
        .infoNavButton:hover {
          background-color: #e9ecef;
          border-color: #ced4da;
          transform: translateY(-1px);
        }

        /* Active/click effect */
        .infoNavButton:active {
          transform: translateY(1px);
        }
    </style>
</head>
<body>
<div id="map"></div>
<div class="resize-handle" id="dragHandler"><hr><hr></div>
<div id="info">
    <div id="infoNav">
        <button id="infoBack" class="infoNavButton" aria-label="Back" onclick="prev_poi()" disabled><span class="arrow">&larr;</span><br>Back</button>
        <button id="infoNext" class="infoNavButton" aria-label="Next" onclick="next_poi()"><span class="arrow">&rarr;</span><br>Next</button>
        <div id="infoBox"></div>
    </div>
</div>
<pre id="debug"></pre>

<script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.2.0/dist/maplibre-gl.mjs';
    import { CompassControl } from '/js/maplibre-gl-compass/dist/maplibre-gl-compass.js'

    const urlParams = new URLSearchParams(window.location.search);
    const debug = urlParams.has('debug');
    let user_mark = null;

    //========= select list control ===========
    class SelectListControl {
      constructor(options) {
        this.options = options || {};
        this.onChange = options.onChange || (() => {});
      }

      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

        // Create the select element
        this._select = document.createElement('select');
        this._select.style.padding = '5px';
        this._select.style.border = 'none';
        this._select.style.background = 'transparent';
        this._select.style.cursor = 'pointer';

        // Populate options from constructor options
        (this.options.items || []).forEach(item => {
          const option = document.createElement('option');
          option.value = item.value;
          option.textContent = item.label;
          this._select.appendChild(option);
        });

        // Listen for changes
        this._select.addEventListener('change', (e) => {
          this.onChange(e.target.value);
        });

        this._container.appendChild(this._select);
        return this._container;
      }

      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/bright',
        //style: 'https://americanamap.org/style.json',
        //style: 'https://maps.black/styles/openstreetmap-protomaps/protomaps/light/style.json',
        zoom: 10, // starting zoom
        attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.FullscreenControl());

    function requestOrientationPermission() {
      // Check if the DeviceOrientationEvent API and requestPermission method exist
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              // Permission granted, start listening to orientation changes
              console.log('Orientation permission granted.');
            } else {
              console.warn('Device orientation permission denied by user.');
            }
          })
          .catch(error => {
            console.error('Error requesting orientation permission:', error);
          });
      } else {
        // Regular browsers that do not require explicit permission calls
        console.log('Orientation permission not required.')
      }
    }

    // Initialize the geolocate control.
    let geolocate = new maplibregl.GeolocateControl({
      positionOptions: {
          enableHighAccuracy: true
      },
      fitBoundsOptions: {
          maxZoom: 18,
      },
      trackUserLocation: true,
      showAccuracyCircle: true,
      showUserLocation: true,
    });
    // Add the control to the map.
    map.addControl(geolocate);
    // Attach request for orientation permissions (for compass)
    const geolocateBtn = document.querySelector('.maplibregl-ctrl-geolocate');
    if (geolocateBtn) {
        geolocateBtn.addEventListener('click', (event) => {
          // Execute the permission request function
          requestOrientationPermission();
          // turn on by default
          compass.turnOn();
        });
    }    

    const compass = new CompassControl({
      debug: false,    // Show debug view. Default is false.
      visible: true,  // Show compass button. Default is true.
      timeout: 10000, // The maximum time to wait for a DeviceOrientationEvent. Default is 3000 [ms].
    });
    map.addControl(compass);

    // Select list of available POI walks
    const poiSourceControl = new SelectListControl({
      items: [
        { value: '/data/bryan_tree_walk.geojson', label: 'Bryan Park' },
        { value: '/data/byrd_tree_walk.geojson', label: 'Byrd Park Vita Course' },
      ],
      onChange: (selectedValue) => {
        console.log('Selected value:', selectedValue);
        const source = map.getSource('pois');
        if (source) {
            source.setData(selectedValue);
        } else {
            map.addSource('pois', {
                type: 'geojson',
                data: selectedValue
            });
        }

        // clear old markers
        poi_markers.forEach((marker) => {
            marker.remove();
        });
        poi_markers=[]
        poi_list=[]
        poi_labels=[]
        poi_features=[]
        // clear old marker line
        if (map.getLayer('poi_route')) { map.removeLayer('poi_route'); }
        if (map.getSource('poi_route')) { map.removeSource('poi_route'); }
        // add new source as markers
        addMarkers('pois');

        zoomToBounds();
      }
    });
    map.addControl(poiSourceControl, 'top-left');

    function initUserMarker() {
        // user marker 
        // find existing marker
        user_mark = document.querySelector('.maplibregl-user-location-dot');
        user_mark.innerHTML = `
<svg
   width="20"
   height="20"
   viewBox="0 0 39.687502 39.687501"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g
     id="layer1"
     transform="translate(-45.478585,-29.116904)">
    <path
       d="M 65.541951,57.836322 50.731312,66.678975 65.54195,29.637798 80.352589,66.678976 Z" />
  </g>
</svg>
        `;
    }
    

    // empty line, for painting user path
    const usertrack_geojson = {
        'type': 'FeatureCollection',
        'features': [{
                'type': 'Feature',
                'geometry': {
                    'type': 'LineString',
                    'coordinates': []
                }}]
    };

    // an event listener that fires
    // on every geolocate event.
    let geohist = []
    var currentPOI = 0; // global: the POI we're currently focused on
    geolocate.on('geolocate', (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const coords = [lng, lat]
        const acc = position.coords.accuracy;
        let lastpos = usertrack_geojson.features[0].geometry.coordinates.at(-1); 
        geohist.push([lng, lat]);
        if (debug) {
            screenLog(`Accuracy: ${acc}<br />(${coords})<br />
Distance moved: ${getDistance(coords,geohist[1])}<br />
Since last: ${getDistance(coords,lastpos)}; gh: ${geohist[0][0], geohist[0][1]}<br />ut: ${lastpos}`);
        }
        if (geohist.length == 1) {
            // first position event we've seen
            initUserMarker();
            usertrack_geojson.features[0].geometry.coordinates.push(geohist[0]);
        }
        if (poi_features.length > 0 && acc < 100) {
            // check all features to find the highest number which is currently in the accuracy circle
            for (let i = currentPOI; i < poi_features.length; i++) {
                const feat_coords = [poi_features[i].geometry.coordinates[0], poi_features[i].geometry.coordinates[1]]
                if (i > currentPOI && getDistance(coords,feat_coords) < acc) {
                    currentPOI = i
                }
            }
            set_current_poi(currentPOI);
        }
        if (geohist.length >= 3) { 
            // check if the last 3 positions are within an accuracy circle (and further away from the last recorded position)
            if (getDistance(coords,geohist[0]) < acc 
                && getDistance(coords,geohist[1]) < acc 
                && getDistance(geohist[1],geohist[0]) < acc 
                && getDistance(coords,lastpos) > acc
                ) {
                // update user movement trail
                //usertrack_geojson.features[0].geometry.coordinates.push([lng, lat]);
                //map.getSource('usertrack_source').setData(usertrack_geojson);
            }
        }
        // keep last 2 positions; remove oldest
        if (geohist.length > 2) { geohist.shift(); }
    });

    // once geojson layer loads, zoom to it
    async function zoomToBounds() {
        try {
            const data = await map.getSource('pois').getData()
            const coordinates = data.features.map(feat => feat.geometry.coordinates)
            // Pass the first coordinates in the LineString to `lngLatBounds` &
            // wrap each coordinate pair in `extend` to include them in the bounds
            // result. A variation of this technique could be applied to zooming
            // to the bounds of multiple Points or Polygon geometries - it just
            // requires wrapping all the coordinates with the extend method.
            const bounds = coordinates.reduce((bounds, coord) => {
                return bounds.extend(coord);
            }, new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));

            const bearing = align_to_poi(0);

            map.fitBounds(bounds, {
                padding: 20,
                linear: true, // use easeTo instead of flyTo
                bearing: bearing
            });

            set_current_poi(0, false);

        } catch (error) {
            console.log('Error: ', error)
        }
    }

    // load svg images
    map.setMissingStyleImageResolver(async (id) => {
        if (!id.endsWith('.svg')) { // only handle local http requests, not every missing image from the style
            return;
        }
        const response = await fetch(id);
        const svgText = await response.text();
        const svg = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
        const image = new Image();
        const promise = new Promise((resolve) => {
            image.onload = resolve;
        });
        image.src = svg;
        await promise; // Wait for the image to load
        if (map.getImage(id)) { // already loaded, ignore
            return;
        }
        map.addImage(id, image);
    });

    const broad = '🌳';
    const conif = '🌲';
    let poi_list = [];
    var poi_features = []; // global for button clicks and keypresses
    async function addMarkers(source) {
        let data = await map.getSource(source).getData();
        poi_features = data.features;
        poi_features.forEach((marker) => {
            // create a DOM element for the marker
            const el = document.createElement('div');
            let tree = '<span style="color: red">★</span>';
            if (marker.properties.leaf_type == 'needleleaved') { tree = conif; }
            else if (marker.properties.leaf_type == 'broadleaved') { tree = broad; }
            el.innerHTML = `<div class="marker">${tree}</div>`;
            const hover = document.createElement("p");
            hover.className = 'marker_label';
            hover.innerHTML = `${marker.properties["species:en"] ?? ""}`;

            //const popup = new maplibregl.Popup({offset: 15, closebutton: false})
            //        .setHTML(`<b>${marker.properties["species:en"]}</b><br>${marker.properties.species}<br>${marker.properties["@id"]}`);

            // add marker to map
            let mark = new maplibregl.Marker({element: el})
                .setLngLat(marker.geometry.coordinates)
            //    .setPopup(popup)
                .addTo(map);
            el.addEventListener('click', () => {
                set_current_poi(poi_features.findIndex(feat => feat.geometry.coordinates === marker.geometry.coordinates));
            });
            el.append(hover);
            poi_markers.push(mark);
            poi_labels.push(hover);
            poi_list.push(marker.geometry.coordinates);
        });

        const poi_linestring = 
            { "type": "Feature", 
                  "properties": { }, 
                  "geometry": { "type": "LineString", 
                                "coordinates": poi_list,
                               } 
            }
        // create new layer using json string
        map.addSource('poi_route', {
            'type': 'geojson',
            'data': poi_linestring,
        });
        map.addLayer({
            'id': 'poi_route',
            'type': 'line',
            'source': 'poi_route',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color': '#8c8',
                'line-width': 8
            }
        });
    }
    // hide marker labels at higher zooms where they're likely to overlap
    const minZoom = 18; 
    let prevZoom = 18;
    map.on('zoom', () => {
      const currentZoom = map.getZoom();

      if (currentZoom < minZoom && prevZoom > minZoom) {
        poi_labels.forEach(element => {
          element.classList.remove('label-show');
        });
      } else if (currentZoom > minZoom && prevZoom < minZoom){
        poi_labels.forEach(element => {
          element.classList.add('label-show');
        });
      }
      prevZoom = currentZoom;
    });

    // load POI points layer
    let poi_markers = []
    let poi_labels = []
    map.on('load', async () => {

        map.addSource('usertrack_source', {
            'type': 'geojson',
            'data': usertrack_geojson
        });
        map.addLayer({
            'id': 'usertrack',
            'type': 'line',
            'source': 'usertrack_source',
            'layout': {
                'line-cap': 'round',
                'line-join': 'round'
            },
            'paint': {
                'line-color': '#6498ed',
                'line-width': 4,
                'line-opacity': 1,
            }
        });

        map.addSource('pois', {
            type: 'geojson',
            data: '/data/bryan_tree_walk.geojson'
        });
        // add as markers
        addMarkers('pois');

        zoomToBounds();
    });


    function prev_poi() {
    	if (currentPOI <= 0) { return; }
        set_current_poi(currentPOI-1);
    }
    window.prev_poi = prev_poi; // expose for button onclick
    function next_poi() {
    	if (currentPOI >= poi_features.length-1) { return; }
        set_current_poi(currentPOI+1);
    }
    window.next_poi = next_poi; // expose for button onclick
    function set_current_poi(poi, move=true) {
        currentPOI = poi;
        const marker = poi_markers[currentPOI];
        const feat = poi_features[currentPOI];
        if (debug) { console.log(`CurrentPOI ${currentPOI}: ${feat}`); }
        document.querySelectorAll('.marker').forEach(el => { el.classList.remove('marker_highlight'); });
        marker.getElement().querySelector('.marker').classList.add('marker_highlight');
        // update info box
        document.querySelector('#infoBox').innerHTML = featInfo(feat);
        // if we're at 0 (or less), disable the back button
        if (currentPOI <= 0) {
            document.querySelector('#infoBack').disabled = true;
        }
        else if (currentPOI >= poi_features.length-1) {
            document.querySelector('#infoNext').disabled = true;
        }
        else {
            document.querySelector('#infoBack').disabled = false;
            document.querySelector('#infoNext').disabled = false;
        }

        if (move) {
            // use the latest user position if we're locked on and history exists
            let userpos = undefined;
            if (document.querySelectorAll('.maplibregl-ctrl-geolocate-active').length > 0 && geohist.length > 0) { 
                userpos = geohist.at(-1); 
            }
            const bearing = align_to_poi(poi);
            map.easeTo({ 
                center: (userpos ?? feat.geometry.coordinates), 
                bearing: bearing,
                duration: 2500 // ms
                 }, {
                    geolocateSource: true // tag this camera change so it won't cause the geolocate control to lose its active lock
            });
        }

        // reset any manual info box resizing
        document.getElementById('map').classList.remove('mapResize');
    }
    // set the camera bearing so it aligns with pref (a) the user else (b) the prev poi at 6 o'clock
    function align_to_poi(poi) {
        let lastpos = []
        let face = 0; // 180 = currentpoi faces next; 0 = user or prev faces currentpoi
        const poipos = poi_features[currentPOI].geometry.coordinates;
        if (currentPOI <= 0) {
            lastpos = poi_features[currentPOI+1].geometry.coordinates // align to next if no prev
            face = 180;
        } else {
            lastpos = poi_features[currentPOI-1].geometry.coordinates // align to prev
        }
        // use the latest user pos if we're locked on and history exists
        if (document.querySelectorAll('.maplibregl-ctrl-geolocate-active').length > 0 && geohist.length > 0) { 
            lastpos = geohist.at(-1); 
        }
        // calculate bearing
        const hyp = getDistance(poipos, lastpos);
        const opp = getDistance(lastpos, [poipos[0], lastpos[1]]) // user 0-deg pov = [user-long, poi-lat]
        const rad = Math.asin(opp/hyp);
        const pole = Math.sign(poipos[1]-lastpos[1]); // 1=N, -1=S
        const turn = pole * Math.sign(poipos[0]-lastpos[0]); // 1=cw (add), -1=ccw (subtract)
        const deg = (pole-1)*90 + (turn * (rad * (180 / Math.PI))); 
        //console.log(`orig: ${map.getBearing()}, rad ${rad}, deg ${deg}, pole ${pole}, turn ${turn}`);
        return (deg + face) % 360; // flip around for the starting point (face next)
    }
    
    function featInfo(feat) {
    	let html = '';
    	if (feat.properties.species) {
    		html += `<h1>${feat.properties["species:en"]}</h1>
<h2>${feat.properties.species}</h2>`
    	}
    	html += `${feat.properties.description}`
    	return html
    }
    
    document.addEventListener('keydown', function(event) {
		switch (event.key) {
		    case 'ArrowLeft':
		        prev_poi();
		        break;
		        
		    case 'ArrowRight':
		        next_poi();
		        break;
		        
		    default:
		        return; // Exit function if other keys are pressed
		}

		// don't scroll page left or right
		event.preventDefault(); 
	});
	
    if (debug) {
    	document.getElementById('debug').classList.add('debug-show');
        map.on('mousemove', (e) => {
            document.getElementById('debug').innerHTML =
                `Zoom: ${map.getZoom()}; Bearing: ${map.getBearing()}
                <br />${
                    // e.lngLat is the longitude, latitude geographical position of the event
                    JSON.stringify(e.lngLat.wrap())}`;
        });
    }


    // -------- utility functions --------------
    // getDistanceFromLatLonInMeters
    function getDistance(coords1, coords2) {
      const [lon1, lat1] = coords1 ?? [0,0];
      const [lon2, lat2] = coords2 ?? [0,0];
      var R = 6371; // Radius of the earth in km
      var dLat = deg2rad(lat2-lat1);  // deg2rad below
      var dLon = deg2rad(lon2-lon1); 
      var a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
        Math.sin(dLon/2) * Math.sin(dLon/2)
        ; 
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      var d = (R * c) * 1000; // Distance in m
      return d;
    }

    function deg2rad(deg) {
      return deg * (Math.PI/180)
    }

    function glide(marker, startCoords, endCoords, duration) {
      const startTime = performance.now();

      function frame(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Linear interpolation formula
        const currentLng = startCoords[0] + (endCoords[0] - startCoords[0]) * progress;
        const currentLat = startCoords[1] + (endCoords[1] - startCoords[1]) * progress;

        marker.setLngLat([currentLng, currentLat]);

        if (progress < 1) {
          requestAnimationFrame(frame);
        }
      }

      requestAnimationFrame(frame);
    }

    // update debug box
    function screenLog(message) {
        if (debug) {
                document.getElementById('debug').innerHTML = message
                }
    }

    // ======= pane resizing helpers =============
    const mapPane = document.getElementById('map');
    const dragHandler = document.getElementById('dragHandler');

    // mouse drag events
    dragHandler.addEventListener('mousedown', function (e) {
      e.preventDefault();
      mapPane.classList.add('mapResize');
      document.addEventListener('mousemove', resizeMouse);
      document.addEventListener('mouseup', stopResize);
    });
    // touch drag events
    dragHandler.addEventListener('touchstart', function (e) {
      // Prevent scrolling/zooming while dragging the slider
      e.preventDefault(); 
      mapPane.classList.add('mapResize');
      document.addEventListener('touchmove', resizeTouch, { passive: false });
      document.addEventListener('touchend', stopResize);
    });

    function resizeMouse(e) {
      calculateAndSetWidth(e.clientY);
    }
    function resizeTouch(e) {
      // Mobile tracks multiple fingers, use the first active touch point [0]
      if (e.touches && e.touches.length > 0) {
        calculateAndSetWidth(e.touches[0].clientY);
      }
    }
    function calculateAndSetWidth(clientYPosition) {
      const containerRect = mapPane.parentElement.getBoundingClientRect();
      const newHeight = clientYPosition - containerRect.top;
      mapPane.style.height = `${newHeight}px`;
    }
    function stopResize() {
      // Remove event listeners when mouse is released
      document.removeEventListener('mousemove', resizeMouse);
      document.removeEventListener('mouseup', stopResize);
      document.removeEventListener('touchmove', resizeTouch);
      document.removeEventListener('touchend', stopResize);
    }

</script>
</body>
</html>
